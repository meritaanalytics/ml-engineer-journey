[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlscratch"
version = "0.1.0"
description = "Machine-learning algorithms from first principles (NumPy), scikit-learn compatible"
authors = [{ name = "Benson M. Merita" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn"]

[tool.setuptools]
packages = ["mlscratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
